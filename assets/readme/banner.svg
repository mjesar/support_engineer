<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AI Support Engineer</title>
  <desc id="desc">A Rails agent that investigates orders, retrieves policies and asks a human before it acts. The loop is: route, act, observe, decide, approve.</desc>
  <rect width="1200" height="300" rx="16" fill="#0f172a"/>
  <text x="60" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700" fill="#e2e8f0">AI Support Engineer</text>
  <text x="60" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#94a3b8">A Rails agent that investigates, retrieves, and asks before it acts</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="60" y="188" width="150" height="46" rx="23" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="135" y="218" fill="#99f6e4">Route</text>
    <rect x="250" y="188" width="150" height="46" rx="23" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="325" y="218" fill="#99f6e4">Act</text>
    <rect x="440" y="188" width="150" height="46" rx="23" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="515" y="218" fill="#99f6e4">Observe</text>
    <rect x="630" y="188" width="150" height="46" rx="23" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="705" y="218" fill="#99f6e4">Decide</text>
    <rect x="820" y="188" width="150" height="46" rx="23" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <text x="895" y="218" fill="#fde68a">Approve</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="214" y1="211" x2="236" y2="211"/>
    <polygon points="244,211 234,206 234,216" fill="#94a3b8" stroke="none"/>
    <line x1="404" y1="211" x2="426" y2="211"/>
    <polygon points="434,211 424,206 424,216" fill="#94a3b8" stroke="none"/>
    <line x1="594" y1="211" x2="616" y2="211"/>
    <polygon points="624,211 614,206 614,216" fill="#94a3b8" stroke="none"/>
    <line x1="784" y1="211" x2="806" y2="211"/>
    <polygon points="814,211 804,206 804,216" fill="#94a3b8" stroke="none"/>
  </g>

  <text x="60" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b">Rails 8 · PostgreSQL · built lesson by lesson as a learning project</text>
</svg>
